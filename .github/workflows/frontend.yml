name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, lint, tests & web build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Bundles the whole app and generates the typed-route declarations that tsc needs.
      - name: Web build (Metro + static rendering)
        run: npx expo export --platform web
        env:
          CI: "1"

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npm run format:check

      - name: Jest
        run: npm run test:ci

      - name: API types match backend/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.ts
